        - cashierName
        - status
        - items
        - itemsSubtotal
        - discountAmount
        - shippingFee
        - totalAmount
        - payments
        - invoice
        - earnedPoints
        - usedPoints
        - createdAt
      properties:
        id:
          type: string
        orderNumber:
          type: string
          example: SO-20260830-0088
        cashierId:
          type: string
        cashierName:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        customerId:
          type: string
        customerName:
          type: string
        customerPhone:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutOrderItem'
        itemsSubtotal:
          type: integer
        discountAmount:
          type: integer
        shippingFee:
          type: integer
        totalAmount:
          type: integer
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PaymentTender'
        invoice:
          $ref: '#/components/schemas/InvoiceInfo'
        earnedPoints:
          type: integer
        usedPoints:
          type: integer
        note:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateOrderItemPayload:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          description: Positive for purchase, negative for return/exchange
        unitPrice:
          type: integer
          description: Cashier-set unit price (re-validated by server unless isManualPrice is true)
        isManualPrice:
          type: boolean
          default: false
        priceDiffReason:
          type: string
        preOrderId:
          type: string
        preOrderItemId:
          type: string
        originalOrderId:
          type: string
          description: Required when quantity < 0 (links return to original sales order)
        originalOrderItemId:
          type: string
          description: Required when quantity < 0 (links return to original item line)
        restock:
          type: boolean
          default: true
          description: For returns, whether returned item is restocked to store inventory
        returnReason:
          type: string

    CreateOrderPayload:
      type: object
      required: [items, payments, invoice]
      properties:
        customerId:
          type: string
        usedPoints:
          type: integer
          default: 0
          description: Points to redeem on this checkout
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderItemPayload'
        shippingFee:
          type: integer
          default: 0
        payments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PaymentTender'
        invoice:
          $ref: '#/components/schemas/InvoiceInfo'
        note:
          type: string

