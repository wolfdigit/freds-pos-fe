openapi: 3.1.0
info:
  title: Fred's POS API
  version: 1.1.0
  description: |
    HTTP contract for Fred's POS, matching the frontend Service Adapter (`src/services/interfaces/`).
    Designed for high-performance model car specialty stores with unified checkout, multi-location stock,
    item-level returns/exchanges, pre-order partial fulfillment, and cash drawer management.

    **Core Architectural Principles**
    - **Single Transaction Pipeline**: All sales, returns, and defect exchanges are unified under `POST /checkout/orders`.
    - **Backend Pricing & Calculation Authority**: Frontend transmits purchase/return intents and cashier-adjusted `unitPrice`; backend calculates all line subtotals, discounts, taxes, and total amounts.
    - **Line-Item Return Traceability**: Returns/exchanges (negative quantities) must reference `originalOrderId` and `originalOrderItemId`, with cumulative `returnedQuantity` tracking.
    - **ACID Atomicity**: Checkout/return operations execute inside a single database transaction (locking store stock, updating pre-orders, updating customer spending/points, and creating orders).
    - **Idempotency**: `POST /checkout/orders` supports `X-Idempotency-Key` to prevent double-charging or double stock deduction.
    - **Authentication**: Cashier and branch identity are resolved from JWT Bearer tokens, bound at cashier login.

    **Conventions**
    - Amounts are TWD integers (no cents).
    - Timestamps are ISO 8601 strings.
    - Business failures use HTTP 4xx with `BusinessError` body (`code` + `message`).

servers:
  - url: http://localhost:8000/api/v1
    description: Local FastAPI Backend
  - url: /api/v1
    description: Relative (same origin)

security:
  - BearerAuth: []

tags:
  - name: products
    description: Product catalog, multi-location stock, and transfers
  - name: checkout
    description: Sales orders, receipts, item-level returns and exchanges
  - name: preorders
    description: Customer pre-orders and arrival management
  - name: customers
    description: Members, VIP tiers, and reward points

paths:
  /products:
    get:
      tags: [products]
      operationId: searchProducts
      summary: Search products
      description: |
        Fuzzy search by barcode, SKU without dashes (normalized), product name, or brand.
        Maps to `IProductService.searchProducts`.
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          description: SKU / barcode / name / brand
        - name: scale
          in: query
          schema:
            $ref: '#/components/schemas/ModelScaleOrAll'
        - name: brand
          in: query
          schema:
            type: string
          description: Brand filter, or `ALL`
        - name: inStockOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Matching products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags: [products]
      operationId: createProduct
      summary: Create product
      description: Maps to `IProductService.createProduct`. Server assigns `id` and computes `normalizedSku` and `totalStock`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /products/{productId}:
    get:
      tags: [products]
      operationId: getProductById
      summary: Get product by ID
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [products]
      operationId: updateProduct
      summary: Update product information
      description: Maps to `IProductService.updateProduct`.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Partial product update properties
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/transfers:
    post:
      tags: [products]
      operationId: transferStock
      summary: Transfer stock between locations
      description: |
        Maps to `IProductService.transferStock`. Executes atomically: deducts from `fromLocation` and adds to `toLocation`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryTransferRequest'
      responses:
        '200':
          description: Transfer succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/adjustments:
    post:
      tags: [products]
      operationId: adjustStock
      summary: Manually set quantity at a location
      description: Maps to `IProductService.adjustStock`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustRequest'
      responses:
        '200':
          description: Adjustment succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/batch-adjustments:
    post:
      tags: [products]
      operationId: batchAdjustStock
      summary: Batch adjust stock quantities and log operation history
      description: Maps to `IProductService.batchAdjustStock`. Writes inventory updates and audit log atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchStockAdjustRequest'
      responses:
        '200':
          description: Batch adjustment succeeded and logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BusinessError'

  /inventory/adjustments/logs:
    get:
      tags: [products]
      operationId: getStockAdjustmentLogs
      summary: Get stock adjustment history logs
      description: Maps to `IProductService.getStockAdjustmentLogs`.
      responses:
        '200':
          description: Stock adjustment logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockAdjustmentLog'

  /checkout/orders:
    get:
      tags: [checkout]
      operationId: getOrderHistory
      summary: List checkout orders
      description: |
        Maps to `ICheckoutService.getOrderHistory`. Supports searching by customer, order number,
        product ID (for finding original sales order during return), date range, or keyword.
      parameters:
        - name: customerId
          in: query
          schema:
            type: string
          description: Filter by customer ID
        - name: orderNumber
          in: query
          schema:
            type: string
          description: Filter by exact or partial order number
        - name: productId
          in: query
          schema:
            type: string
          description: Filter orders containing this product (used for counter return lookup)
        - name: keyword
          in: query
          schema:
            type: string
          description: Search by customer phone, name, tax ID, carrier code, or order number
        - name: startDate
          in: query
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD)
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD)
        - name: status
          in: query
          schema:
            type: string
            enum: [all, completed, partially_refunded, refunded]
      responses:
        '200':
          description: Order list (newest-first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CheckoutOrder'
    post:
      tags: [checkout]
      operationId: createCheckoutOrder
      summary: Create checkout order (Sales, Exchanges, and Returns)
      description: |
        Maps to `ICheckoutService.createCheckoutOrder`.

        **Backend Atomic Lifecycle (Single DB Transaction)**:
        1. **Identity & Branch Resolution**: Extract `cashierId`, `cashierName`, and active `storeId` from `BearerAuth` JWT token.
        2. **Item Pricing & Subtotals**:
           - For positive purchases: verify `unitPrice` against `listPrice` or customer `vipPrice` unless `isManualPrice: true` (which requires `priceDiffReason`).
           - For pre-order items: verify `unitPrice` matches `quotedPrice` and `quantity <= qtyArrived - qtyDelivered`.
           - For return/exchange items (`quantity < 0`): verify `originalOrderId` & `originalOrderItemId`, ensuring `abs(quantity) <= (qtySold - qtyReturned)`. Also enforce member ownership: if the checkout is bound to customer A, the original order cannot belong to customer B (`customerId` mismatch raises `INVALID_RETURN_CUSTOMER`; unattached guest original orders are permitted).
           - Compute `subtotal = unitPrice * quantity` for each line.
        3. **Order Total & Points**:
           - `itemsSubtotal = sum(subtotals)`
           - `discountAmount = sum((originalPrice - unitPrice) * quantity)`
           - Validate `usedPoints <= customer.rewardPoints` and calculate final `totalAmount = itemsSubtotal + shippingFee - usedPoints`.
           - Validate `sum(payments.amount) == totalAmount` (or `payments >= totalAmount` with cash change).
        4. **Inventory & Pre-Order Atomicity**:
           - Positive items: lock and deduct `store` stock with row lock (`WHERE quantity >= :qty`).
           - Negative items: if `restock: true`, increment `store` stock; increment `returnedQuantity` on original order.
           - Pre-order items: increment `qtyDelivered` and update pre-order status.
        5. **Member Asset Update**:
           - Update `customer.totalSpent += totalAmount`
           - Update `customer.rewardPoints += (earnedPoints - usedPoints)`
        6. **Receipt & Persistence**:
           - Persist `CheckoutOrder` and return `CheckoutReceipt` with thermal print HTML.
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Optional UUID to guarantee idempotent order creation and prevent double-billing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderPayload'
      responses:
        '201':
          description: Order created with receipt HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutReceipt'
        '400':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/NotFound'

  /checkout/orders/{orderId}:
    get:
      tags: [checkout]
      operationId: getOrderById
      summary: Get order by ID (reprint receipt / check return status)
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOrder'
        '404':
          $ref: '#/components/responses/NotFound'

  /preorders:
    get:
      tags: [preorders]
      operationId: getPendingPreOrders
      summary: Search open pre-orders
      description: |
        Maps to `IPreOrderService.getPendingPreOrders`.
        Matches customer phone, name, or order number. Excludes `completed` and `cancelled`.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: Phone fragment, name, or order number (e.g. `0912`)
      responses:
        '200':
          description: Matching open pre-orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreOrder'
    post:
      tags: [preorders]
      operationId: createPreOrder
      summary: Create pre-order
      description: Maps to `IPreOrderService.createPreOrder`. Server assigns `id`, `orderNumber`, `status`, and `updatedAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePreOrderRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreOrder'

  /customers/{customerId}/preorders:
    get:
      tags: [preorders]
      operationId: getPreOrdersByCustomerId
      summary: List pre-orders for a customer
      description: Maps to `IPreOrderService.getPreOrdersByCustomerId` (all statuses).
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Pre-orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreOrder'

  /preorders/{preOrderId}:
    get:
      tags: [preorders]
      operationId: getPreOrderById
      summary: Get pre-order by ID
      parameters:
        - $ref: '#/components/parameters/PreOrderId'
      responses:
        '200':
          description: Pre-order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreOrder'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [preorders]
      operationId: updatePreOrder
      summary: Update pre-order information
      description: Maps to `IPreOrderService.updatePreOrder`.
      parameters:
        - $ref: '#/components/parameters/PreOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreOrderRequest'
      responses:
        '200':
          description: Updated pre-order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreOrder'
        '404':
          $ref: '#/components/responses/NotFound'

  /preorders/{preOrderId}/arrived:
    post:
      tags: [preorders]
      operationId: markItemsArrived
      summary: Mark pre-order items arrived (Phase 2)
      description: Updates `qtyArrived` for specified products and re-derives pre-order status.
      parameters:
        - $ref: '#/components/parameters/PreOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkItemsArrivedRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers:
    get:
      tags: [customers]
      operationId: searchCustomers
      summary: Search customers
      description: Maps to `ICustomerService.searchCustomers`. Empty query returns all.
      parameters:
        - name: query
          in: query
          schema:
            type: string
          description: Phone or name fragment
      responses:
        '200':
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
    post:
      tags: [customers]
      operationId: createCustomer
      summary: Create customer
      description: Maps to `ICustomerService.createCustomer`. Server assigns `id` and `createdAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /customers/{customerId}:
    get:
      tags: [customers]
      operationId: getCustomerById
      summary: Get customer by ID
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [customers]
      operationId: updateCustomer
      summary: Update customer information
      description: Maps to `ICustomerService.updateCustomer`.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers/by-phone/{phone}:
    get:
      tags: [customers]
      operationId: getCustomerByPhone
      summary: Get customer by exact phone
      description: Maps to `ICustomerService.getCustomerByPhone` (checkout member bind).
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
          example: '0912345678'
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authenticated cashier / store staff token containing cashierId, name, and active store branch.

  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
      example: prod-001
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
      example: so-2001
    PreOrderId:
      name: preOrderId
      in: path
      required: true
      schema:
        type: string
      example: po-1001
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
      example: cust-001

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
          example:
            code: PRODUCT_NOT_FOUND
            message: 找不到指定資源
    BusinessError:
      description: Business rule failed (no partial writes)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
          examples:
            insufficientStock:
              value:
                code: INSUFFICIENT_STORE_STOCK
                message: 門市現貨不足，請先從倉庫調撥
            preorderQty:
              value:
                code: PREORDER_QTY_EXCEEDED
                message: 超過可取數量上限
            returnQty:
              value:
                code: RETURN_QTY_EXCEEDED
                message: 退貨數量超過原單剩餘可退上限
            insufficientPoints:
              value:
                code: INSUFFICIENT_POINTS
                message: 會員點數餘額不足
            payment:
              value:
                code: PAYMENT_INSUFFICIENT
                message: 支付總額不足

  schemas:
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    BusinessError:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/BusinessErrorCode'
        message:
          type: string

    BusinessErrorCode:
      type: string
      enum:
        - INSUFFICIENT_STORE_STOCK
        - PREORDER_QTY_EXCEEDED
        - RETURN_QTY_EXCEEDED
        - INSUFFICIENT_POINTS
        - PAYMENT_INSUFFICIENT
        - PRODUCT_NOT_FOUND
        - ORDER_NOT_FOUND
        - STORAGE_CORRUPTED

    ModelScale:
      type: string
      enum:
        - '1:18'
        - '1:43'
        - '1:64'
        - '1:24'
        - '1:12'
        - 配件周邊

    ModelScaleOrAll:
      oneOf:
        - $ref: '#/components/schemas/ModelScale'
        - type: string
          const: ALL

    StockLocation:
      type: string
      enum: [store, warehouse, company, other]

    LocationStock:
      type: object
      required: [location, locationName, quantity]
      properties:
        location:
          $ref: '#/components/schemas/StockLocation'
        locationName:
          type: string
          example: 門市現貨
        quantity:
          type: integer

    ProductStatus:
      type: string
      enum: [active, discontinued]

    Product:
      type: object
      required:
        - id
        - sku
        - normalizedSku
        - barcode
        - brand
        - name
        - scale
        - listPrice
        - costPrice
        - stocks
        - totalStock
        - preOrderPendingCount
        - status
      properties:
        id:
          type: string
        sku:
          type: string
          example: AA-79121
        normalizedSku:
          type: string
          example: AA79121
        barcode:
          type: string
        brand:
          type: string
        name:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
        material:
          type: string
        color:
          type: string
        imageUrl:
          type: string
        listPrice:
          type: integer
        costPrice:
          type: integer
        vipPrice:
          type: integer
        stocks:
          type: array
          items:
            $ref: '#/components/schemas/LocationStock'
        totalStock:
          type: integer
        preOrderPendingCount:
          type: integer
        note:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'

    CreateProductRequest:
      type: object
      required:
        - sku
        - normalizedSku
        - barcode
        - brand
        - name
        - scale
        - listPrice
        - costPrice
        - stocks
        - totalStock
        - preOrderPendingCount
        - status
      properties:
        sku:
          type: string
        normalizedSku:
          type: string
        barcode:
          type: string
        brand:
          type: string
        name:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
        material:
          type: string
        color:
          type: string
        imageUrl:
          type: string
        listPrice:
          type: integer
        costPrice:
          type: integer
        vipPrice:
          type: integer
        stocks:
          type: array
          items:
            $ref: '#/components/schemas/LocationStock'
        totalStock:
          type: integer
        preOrderPendingCount:
          type: integer
        note:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'

    InventoryTransferRequest:
      type: object
      required: [productId, fromLocation, toLocation, quantity]
      properties:
        productId:
          type: string
        fromLocation:
          $ref: '#/components/schemas/StockLocation'
        toLocation:
          $ref: '#/components/schemas/StockLocation'
        quantity:
          type: integer
          minimum: 1
        reason:
          type: string
        operatorId:
          type: string

    StockAdjustRequest:
      type: object
      required: [productId, location, newQuantity, reason]
      properties:
        productId:
          type: string
        location:
          $ref: '#/components/schemas/StockLocation'
        newQuantity:
          type: integer
          minimum: 0
        reason:
          type: string

    BatchStockAdjustRequest:
      type: object
      required: [adjustments, operatorName, timestamp]
      properties:
        operatorName:
          type: string
        timestamp:
          type: string
        note:
          type: string
        adjustments:
          type: array
          items:
            $ref: '#/components/schemas/StockItemAdjustment'

    StockLocationChange:
      type: object
      required: [location, locationName, oldQty, newQty, diff]
      properties:
        location:
          $ref: '#/components/schemas/StockLocation'
        locationName:
          type: string
        oldQty:
          type: integer
        newQty:
          type: integer
        diff:
          type: integer

    StockItemAdjustment:
      type: object
      required: [productId, sku, name, brand, changes, summaryText]
      properties:
        productId:
          type: string
        sku:
          type: string
        name:
          type: string
        brand:
          type: string
        changes:
          type: array
          items:
            $ref: '#/components/schemas/StockLocationChange'
        summaryText:
          type: string

    StockAdjustmentLog:
      type: object
      required: [id, timestamp, operatorName, items, totalQtyChange]
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        operatorName:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/StockItemAdjustment'
        totalQtyChange:
          type: integer
        note:
          type: string

    PaymentMethodType:
      type: string
      enum: [cash, credit_card, line_pay, bank_transfer, cod]

    PaymentTender:
      type: object
      required: [type, name, amount]
      properties:
        type:
          $ref: '#/components/schemas/PaymentMethodType'
        name:
          type: string
          example: 現金
        amount:
          type: integer
        tenderedCash:
          type: integer
          description: Cash notes received
        changeAmount:
          type: integer
        transactionRef:
          type: string
          description: Card last-4 or transfer last-5

    InvoiceInfo:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [none, carrier, tax_id, paper]
        carrierCode:
          type: string
          example: /ABC+123
        taxId:
          type: string
          example: '83521409'
        buyerTitle:
          type: string

    CheckoutOrderItem:
