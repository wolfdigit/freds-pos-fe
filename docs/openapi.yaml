openapi: 3.1.0
info:
  title: Fred's POS API
  version: 1.1.0
  description: |
    HTTP contract for Fred's POS, matching the frontend Service Adapter (`src/services/interfaces/`).
    Designed for high-performance model car specialty stores with unified checkout, multi-location stock,
    item-level returns/exchanges, and cash drawer management.

    **Core Architectural Principles**
    - **Single Transaction Pipeline**: All sales, returns, and defect exchanges are unified under `POST /checkout/orders`.
    - **Backend Pricing & Calculation Authority**: Frontend transmits purchase/return intents and cashier-adjusted `unitPrice`; backend calculates all line subtotals, discounts, taxes, and total amounts.
    - **Line-Item Return Traceability**: Returns/exchanges (negative quantities) must reference `originalOrderId` and `originalOrderItemId`, with cumulative `returnedQuantity` tracking.
    - **ACID Atomicity**: Checkout/return operations execute inside a single database transaction (locking store stock, updating customer spending, and creating orders).
    - **Idempotency**: `POST /checkout/orders` supports `X-Idempotency-Key` to prevent double-charging or double stock deduction.
    - **Authentication**: Cashier and branch identity are resolved from JWT Bearer tokens, bound at cashier login.

    **Conventions**
    - Amounts are TWD integers (no cents).
    - Timestamps are ISO 8601 strings.
    - Business failures use HTTP 4xx with `BusinessError` body (`code` + `message`).

servers:
  - url: http://localhost:8000/api/v1
    description: Local FastAPI Backend
  - url: /api/v1
    description: Relative (same origin)

security:
  - BearerAuth: []

tags:
  - name: products
    description: Product catalog, multi-location stock, and transfers
  - name: checkout
    description: Sales orders, receipts, item-level returns and exchanges
  - name: customers
    description: Members and VIP tiers
  - name: system
    description: System configurations, store branches, and Google OAuth access control whitelist

paths:
  /products:
    get:
      tags: [products]
      operationId: searchProducts
      description: |
        Login store with `productScope: list`: only products in that store's list (`store_product`) are returned,
        including `barcode` lookups. Any business user may pass `allProducts=true` to skip the list (each row still has `soldInLoginStore`).
        Admin with no selected store sees every product. `productScope: all` stores are unchanged.
        `storeName` looks at another store for this request only: its list, the `loginStore*` quantities,
        `soldInLoginStore` and `loginStoreQuantityMin/Max` all describe that store. `allProducts=true` still skips the list.
        Fuzzy search by barcode, SKU without dashes (normalized), product name, or brand.
        Maps to `IProductService.searchProducts`.
        Default sort: `sku ASC`.
        Omits products with `status: deleted`. `GET /products/{productId}` still returns a hidden row.
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          description: SKU / barcode / name / brand
        - name: scale
          in: query
          schema:
            $ref: '#/components/schemas/ModelScaleOrAll'
        - name: brand
          in: query
          schema:
            type: string
          description: Brand filter, or `ALL`
        - name: inInventoryOnly
          in: query
          schema:
            type: boolean
            default: false
        - name: allProducts
          in: query
          schema:
            type: boolean
            default: false
          description: Ignore the store's product list. Any business user (staff included). Wins over `storeName`'s list.
        - name: storeName
          in: query
          schema:
            type: string
          description: |
            Use this store instead of the login store (list filter, `loginStore*` fields, `soldInLoginStore`,
            `loginStoreQuantityMin/Max`). Blank = login store. Any business user. Unknown store → `404` `STORE_NOT_FOUND`.
          description: Keep products whose totalInventory is greater than 0.
      responses:
        '200':
          description: Matching products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags: [products]
      operationId: createProduct
      description: |
        When the login store has `productScope: list`, the new product is added to that store's list.
        It is not added to any other `list` store.
        Maps to `IProductService.createProduct`.
        Server assigns `id` as `prod-{uuid4}` (no dashes), computes `normalizedSku`,
        and does not insert inventory rows. A missing row reads as 0.
        `status` is optional. When omitted, the server stores `active`.
        Initial / ongoing stock quantities use future inventory APIs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '409':
          description: Duplicate SKU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
              example:
                code: PRODUCT_SKU_DUPLICATE
                message: 貨號已存在

  /products/{productId}:
    get:
      tags: [products]
      operationId: getProductById
      summary: Get product by ID
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [products]
      operationId: updateProduct
      summary: Update product information
      description: |
        Maps to `IProductService.updateProduct`.
        Metadata only — does not mutate stock rows.
        On SKU change, server recomputes `normalizedSku`; duplicate SKU returns 409.
        `status: deleted` hides the product. `status: active` shows it again. The row is not removed.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Duplicate SKU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
              example:
                code: PRODUCT_SKU_DUPLICATE
                message: 貨號已存在

  /inventory/transfers:
    post:
      tags: [products]
      operationId: transferStock
      summary: Transfer stock between locations
      description: |
        Maps to `IProductService.transferStock`. Executes atomically: deducts from `fromLocation` and adds to `toLocation`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryTransferRequest'
      responses:
        '200':
          description: Transfer succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Source location does not have enough quantity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
              example:
                code: INSUFFICIENT_INVENTORY
                message: 調出地點庫存不足

  /inventory/transfers/all:
    post:
      tags: [products]
      operationId: moveAllStock
      summary: Move every non-zero quantity at one location
      description: |
        Moves every quantity that is not exactly 0, including negatives.
        Store bindings stay on the source location.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveAllStockRequest'
      responses:
        '200':
          description: Move succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/receipts:
    post:
      tags: [products]
      operationId: createInventoryReceipt
      summary: Receive quantity into a location
      description: |
        Adds quantity at locationId. Repeated lines for the same product are summed.
        Lines are inventory movements and are returned as items.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventoryReceiptRequest'
      responses:
        '201':
          description: Receipt created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryReceipt'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [products]
      operationId: searchInventoryReceipts
      summary: List inventory receipts
      parameters:
        - name: locationId
          in: query
          schema:
            type: string
        - name: productId
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Receipt page, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryReceiptPage'

  /inventory/movements:
    get:
      tags: [products]
      operationId: searchInventoryMovements
      summary: List inventory movements
      parameters:
        - name: productId
          in: query
          schema:
            type: string
        - name: locationId
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [receipt, transfer_out, transfer_in, adjust, sale, return_restock]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Movement page, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryMovementPage'

  /inventory/adjustments:
    post:
      tags: [products]
      operationId: adjustStock
      summary: Manually set quantity at a location
      description: Maps to `IProductService.adjustStock`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustRequest'
      responses:
        '200':
          description: Adjustment succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/batch-adjustments:
    post:
      tags: [products]
      operationId: batchAdjustStock
      summary: Batch adjust stock quantities and log operation history
      description: Maps to `IProductService.batchAdjustStock`. Writes inventory updates and audit log atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchStockAdjustRequest'
      responses:
        '200':
          description: Batch adjustment succeeded and logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BusinessError'

  /inventory/adjustments/logs:
    get:
      tags: [products]
      operationId: getStockAdjustmentLogs
      summary: Get stock adjustment history logs
      description: Maps to `IProductService.getStockAdjustmentLogs`.
      responses:
        '200':
          description: Stock adjustment logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockAdjustmentLog'

  /inventory/locations:
    get:
      tags: [products]
      operationId: getLocations
      summary: Get all stock locations
      description: |
        Maps to `ILocationService.getLocations`. Retrieves all active stock locations in the system.
      responses:
        '200':
          description: List of stock locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockLocationDto'
    post:
      tags: [products]
      operationId: createLocation
      summary: Create a new stock location
      description: |
        Maps to `ILocationService.createLocation`. Adds a new custom inventory location to the system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStockLocationRequest'
      responses:
        '201':
          description: Created stock location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLocationDto'

  /inventory/locations/{locationId}:
    put:
      tags: [products]
      operationId: updateLocation
      summary: Update a stock location
      description: |
        Maps to `ILocationService.updateLocation`. Updates name, icon, display order, or active state of a location.
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique Primary Key (UUID) of the location to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStockLocationRequest'
      responses:
        '200':
          description: Updated stock location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLocationDto'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [products]
      operationId: deleteLocation
      summary: Delete a location without moving quantity
      description: |
        Does not move quantity. `409 SYSTEM_LOCATION` for a system location (公司總倉 / 預購保留 / 退貨品). `409 LAST_LOCATION` when this is the only location.
        `409 LOCATION_NOT_EMPTY` when any quantity is not exactly 0, including negatives.
        When stores use this location (normal, returned, or preorder binding), `rebindToLocation` is required and must be a different existing location.
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique Primary Key (UUID) of the location to delete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteStockLocationRequest'
      responses:
        '200':
          description: Location deleted and stock migrated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteStockLocationResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/NotFound'

  /checkout/orders:
    get:
      tags: [checkout]
      operationId: getOrderHistory
      summary: List checkout orders
      description: |
        Maps to `ICheckoutService.getOrderHistory`. Supports searching by customer, order number,
        product ID (for finding original sales order during return), date range, or keyword.
        `storeName` keeps only orders checked out at that store (`branchId`); a return counts toward the store that
        processed it. Orders of deleted stores and old `branch-store` / `branch-online` orders only appear without it.
      parameters:
        - name: customerId
          in: query
          schema:
            type: string
          description: Filter by customer ID
        - name: orderNumber
          in: query
          schema:
            type: string
          description: Filter by exact or partial order number
        - name: productId
          in: query
          schema:
            type: string
          description: Filter orders containing this product (used for counter return lookup)
        - name: keyword
          in: query
          schema:
            type: string
          description: Search by customer phone, name, or order number
        - name: startDate
          in: query
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD)
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD)
        - name: status
          in: query
          schema:
            type: string
            enum: [all, completed, partially_refunded, refunded]
        - name: storeName
          in: query
          schema:
            type: string
          description: Only orders checked out at this store (`branchId`). Blank = not sent = all stores. Unknown store → `404` `STORE_NOT_FOUND`.
      responses:
        '200':
          description: Order list (newest-first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CheckoutOrder'
        '404':
          description: '`storeName` is not a store (`STORE_NOT_FOUND`)'
    post:
      tags: [checkout]
      operationId: createCheckoutOrder
      summary: Create checkout order (Sales, Exchanges, and Returns)
      description: |
        Maps to `ICheckoutService.createCheckoutOrder`.

        **Backend Atomic Lifecycle (Single DB Transaction)**:
        1. **Identity & Branch Resolution**: Extract `cashierId`, `cashierName`, and active `storeId` from `BearerAuth` JWT token.
        2. **Item Pricing & Subtotals**:
           - Login store with `productScope: list`: a positive line whose product is not in that store's list fails with `409` `PRODUCT_NOT_IN_STORE` before any write. Return lines (`quantity < 0`) are not checked, the same as delisted products.
           - For positive purchases: verify `unitPrice` against `listPrice` or customer `vipPrice` unless `isManualPrice: true` (which requires `priceDiffReason`).
           - For return/exchange items (`quantity < 0`): verify `originalOrderId` & `originalOrderItemId`, ensuring `abs(quantity) <= (qtySold - qtyReturned)`. Also enforce member ownership: if the checkout is bound to customer A, the original order cannot belong to customer B (`customerId` mismatch raises `INVALID_RETURN_CUSTOMER`; unattached guest original orders are permitted).
           - Compute `subtotal = unitPrice * quantity` for each line.
        3. **Order Total**:
           - `itemsSubtotal = sum(subtotals)`
           - `discountAmount = sum((originalPrice - unitPrice) * quantity)`
           - Calculate final `totalAmount = itemsSubtotal + shippingFee`.
           - Validate `sum(payments.amount) == totalAmount` (or `payments >= totalAmount` with cash change).
        4. **Inventory Atomicity**:
           - Positive items: lock and deduct `store` stock with row lock (`WHERE quantity >= :qty`).
           - Negative items: omitted or `restock: true` adds the count to the login store's normal location (sellable). `restock: false` adds the count to that store's returned location. Both change quantity. Also increment `returnedQuantity` on the original order.
        5. **Member Asset Update**:
           - Update `customer.totalSpent += totalAmount`
        6. **Receipt & Persistence**:
           - Persist `CheckoutOrder` and return `CheckoutReceipt` as `{ order }`. The client formats the slip.
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Optional UUID to guarantee idempotent order creation and prevent double-billing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderPayload'
      responses:
        '201':
          description: Order created with receipt HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutReceipt'
        '400':
          $ref: '#/components/responses/BusinessError'
        '409':
          description: A positive line's product is not sold at the login store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
              example:
                code: PRODUCT_NOT_IN_STORE
                message: '本門市未販售此商品：SKU-001 (ID: prod-...)'
        '404':
          $ref: '#/components/responses/NotFound'

  /checkout/orders/{orderId}:
    get:
      tags: [checkout]
      operationId: getOrderById
      summary: Get order by ID (reprint receipt / check return status)
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOrder'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers:
    get:
      tags: [customers]
      operationId: searchCustomers
      summary: Search customers
      description: Maps to `ICustomerService.searchCustomers`. Empty query returns all with pagination.
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          description: Phone, name, or email for fuzzy matching
        - name: vipTier
          in: query
          schema:
            type: string
            enum: [ALL, Retail, B, A, S]
          description: Filter by VIP tier or ALL
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
          description: Items per page
      responses:
        '200':
          description: Customers list or paginated response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CustomerSearchResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/Customer'
    post:
      tags: [customers]
      operationId: createCustomer
      summary: Create customer
      description: Maps to `ICustomerService.createCustomer`. Server assigns `id` and `createdAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /customers/{customerId}:
    get:
      tags: [customers]
      operationId: getCustomerById
      summary: Get customer by ID
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [customers]
      operationId: updateCustomer
      summary: Update customer information
      description: Maps to `ICustomerService.updateCustomer`.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [customers]
      operationId: deleteCustomer
      summary: Delete a customer
      description: Maps to `ICustomerService.deleteCustomer`.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '204':
          description: Customer deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /customers/{customerId}/spending:
    post:
      tags: [customers]
      operationId: updateCustomerSpending
      summary: Update customer total spending
      description: Maps to `ICustomerService.updateCustomerSpending`.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: integer
                  description: Spent amount in TWD
      responses:
        '200':
          description: Customer spending updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /system/stores:
    get:
      tags: [system]
      operationId: getStores
      summary: Get all store branches
      description: |
        Retrieves all configured store branches (登入門市清單).
      responses:
        '200':
          description: List of store branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreDto'
    post:
      tags: [system]
      operationId: createStore
      summary: Add a new store branch
      description: |
        Admin only. Requires an existing normal location and an existing returned location. The two ids may be the same. Does not create a location.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoreRequest'
      responses:
        '201':
          description: Created store branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreDto'
        '400':
          $ref: '#/components/responses/BusinessError'

  /system/stores/{storeName}:
    put:
      tags: [system]
      operationId: rebindStore
      summary: Rebind a store's inventory locations
      description: |
        Admin only. Both location ids are required and may be the same. Does not move quantity already posted.
      parameters:
        - name: storeName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoreBindingRequest'
      responses:
        '200':
          description: Updated store binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreDto'
        '403':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [system]
      operationId: deleteStore
      summary: Delete a store branch
      description: |
        Removes a store branch from the system. System requires at least one store branch to remain active.
      parameters:
        - name: storeName
          in: path
          required: true
          schema:
            type: string
          description: Name of the store branch to delete
      responses:
        '200':
          description: Store branch deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  deletedStore:
                    type: string
                    example: 台中一中店
        '400':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/NotFound'

  /system/stores/{storeName}/product-scope:
    put:
      tags: [system]
      operationId: setStoreProductScope
      summary: Switch a store between all products and its own list
      description: |
        Any business user (staff included). Other store management stays admin-only.
        Switching back to `all` keeps the list rows, so switching to `list` again reuses them.
        Missing store is `404` `STORE_NOT_FOUND`.
      parameters:
        - name: storeName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoreProductScopeRequest'
      responses:
        '200':
          description: Updated store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreDto'
        '404':
          $ref: '#/components/responses/NotFound'

  /system/stores/{storeName}/products:
    get:
      tags: [system]
      operationId: listStoreProducts
      summary: Store product list editor (search the catalog, paged)
      description: |
        Any business user (staff included). Searches the whole catalog (deleted products omitted) with the same
        `keyword` rules as `GET /products`, and marks each row `inList`. Sort `sku ASC, id ASC`.
        Deleted products stay in `store_product` but are hidden here and in `listedTotal`.
      parameters:
        - name: storeName
          in: path
          required: true
          schema:
            type: string
        - name: keyword
          in: query
          schema:
            type: string
          description: SKU / barcode / name / brand
        - name: inList
          in: query
          schema:
            type: boolean
          description: '`true`: only listed. `false`: only unlisted. Omit: both.'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreProductPage'
        '404':
          $ref: '#/components/responses/NotFound'

  /system/stores/{storeName}/products/batch:
    post:
      tags: [system]
      operationId: batchStoreProducts
      summary: Save list edits (add and remove in one request)
      description: |
        Any business user. The editor stages checkbox changes and sends them here once on 存檔.
        `add` and `remove` are applied in one transaction: if any `add` id is unknown or deleted the whole request is
        `404` `PRODUCT_NOT_FOUND` and nothing changes. Ids already in the list (add) or not in it (remove) are skipped
        and not counted. `remove` accepts deleted products. An id in both lists, both lists empty, or more than 2000 ids
        in total is `422`. `addedBy` / `addedAt` come from the signed-in account and server time.
        Works for an `all` store too; the list takes effect once the store is switched to `list`.
      parameters:
        - name: storeName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreProductBatchRequest'
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreProductChangeResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Validation error

  /system/stores/{storeName}/products/copy:
    post:
      tags: [system]
      operationId: copyStoreProducts
      summary: Copy another store's list
      description: |
        Any business user. Copies the source store's `store_product` rows (deleted products skipped), whatever the
        source's `productScope` is. Missing source or target store is `404` `STORE_NOT_FOUND`.
      parameters:
        - name: storeName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyStoreProductsRequest'
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreProductChangeResult'
        '404':
          $ref: '#/components/responses/NotFound'

  /system/oauth/accounts:
    get:
      tags: [system]
      operationId: getOAuthAccounts
      summary: Get Google OAuth authorized accounts whitelist
      description: |
        Retrieves all authorized Google accounts for admin and staff roles, including display names, roles, and notes.
      parameters:
        - name: role
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OAuthRole'
          description: Optional filter by role (`admin` or `staff`)
      responses:
        '200':
          description: List of authorized OAuth accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OAuthAccountDto'
    post:
      tags: [system]
      operationId: createOAuthAccount
      summary: Add an authorized Google OAuth account
      description: |
        Adds a new authorized Google account to the whitelist with role, display name, and optional note.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOAuthAccountRequest'
      responses:
        '201':
          description: Created OAuth account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAccountDto'
        '400':
          $ref: '#/components/responses/BusinessError'

  /system/oauth/accounts/{email}:
    put:
      tags: [system]
      operationId: updateOAuthAccount
      summary: Update an authorized Google OAuth account
      description: |
        Updates the display name, note, or role of an existing authorized Google OAuth account.
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
          description: Google account Gmail address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOAuthAccountRequest'
      responses:
        '200':
          description: Updated OAuth account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAccountDto'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [system]
      operationId: deleteOAuthAccount
      summary: Remove a Google OAuth account from whitelist
      description: |
        Removes an authorized Google account from the whitelist.
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
          description: Google account Gmail address to remove
      responses:
        '200':
          description: Account removed from whitelist
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  deletedEmail:
                    type: string
                    example: clerk01@gmail.com
        '400':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authenticated cashier / store staff token containing cashierId, name, and active store branch.

  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
      example: prod-001
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
      example: so-2001
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
      example: cust-001

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
          example:
            code: PRODUCT_NOT_FOUND
            message: 找不到指定資源
    BusinessError:
      description: Business rule failed (no partial writes)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessError'
          examples:
            insufficientStock:
              value:
                code: INSUFFICIENT_STORE_STOCK
                message: 門市現貨不足，請先從倉庫調撥
            returnQty:
              value:
                code: RETURN_QTY_EXCEEDED
                message: 退貨數量超過原單剩餘可退上限
            payment:
              value:
                code: PAYMENT_INSUFFICIENT
                message: 支付總額不足

  schemas:
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    BusinessError:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/BusinessErrorCode'
        message:
          type: string

    BusinessErrorCode:
      type: string
      enum:
        - INSUFFICIENT_STORE_STOCK
        - INSUFFICIENT_INVENTORY
        - LOCATION_NOT_EMPTY
        - LAST_LOCATION
        - SYSTEM_LOCATION
        - LOCATION_NAME_TAKEN
        - INVENTORY_LOCATION_IN_USE
        - RETURN_QTY_EXCEEDED
        - PAYMENT_INSUFFICIENT
        - PRODUCT_NOT_FOUND
        - PRODUCT_SKU_DUPLICATE
        - PRODUCT_NOT_IN_STORE
        - ORDER_NOT_FOUND
        - LOCATION_NOT_FOUND
        - INVALID_LOCATION_TRANSFER
        - TARGET_LOCATION_NOT_FOUND
        - STORE_NOT_FOUND
        - STORAGE_CORRUPTED

    ModelScale:
      type: string
      enum:
        - '1:18'
        - '1:43'
        - '1:64'
        - '1:24'
        - '1:12'
        - 配件周邊

    ModelScaleOrAll:
      oneOf:
        - $ref: '#/components/schemas/ModelScale'
        - type: string
          const: ALL

    StockLocation:
      type: string
      description: Stock location identifier (UUID or default location identifier)
      example: e1a10002-0000-4000-8000-000000000002

    StockLocationDto:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          description: Unique Primary Key (UUID)
          example: e1a10001-0000-4000-8000-000000000001
        name:
          type: string
          example: 後方倉庫
        icon:
          type: string
          example: 📦
        isDefault:
          type: boolean
          default: false
        displayOrder:
          type: integer
          default: 1
        storeNames:
          type: array
          items:
            type: string
          description: Stores that use this location for normal goods.
        returnedStoreNames:
          type: array
          items:
            type: string
          description: Stores that use this location for returned goods.
        preorderStoreNames:
          type: array
          items:
            type: string
          description: Stores that use this location to hold preorder stock (預購保留).
        systemRole:
          type: string
          nullable: true
          enum: [company, preorder, defective, null]
          description: 系統庫存點：公司總倉 = company、預購保留 = preorder、退貨品 = defective。不能刪，可以改名、改圖示。一般地點為 null。

    CreateStockLocationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: 高雄巨蛋門市
        icon:
          type: string
          example: 🏬
        displayOrder:
          type: integer

    UpdateStockLocationRequest:
      type: object
      properties:
        name:
          type: string
          example: 門市展示區
        icon:
          type: string
          example: 🏪
        displayOrder:
          type: integer
          example: 1

    DeleteStockLocationRequest:
      type: object
      properties:
        rebindToLocation:
          type: string
          description: Required when any store uses this location. Must be a different existing location.

    DeleteStockLocationResponse:
      type: object
      required: [deletedLocation, reboundStoreNames]
      properties:
        deletedLocation:
          type: string
        reboundStoreNames:
          type: array
          items:
            type: object
            required: [name, binding, inventoryLocationId]
            properties:
              name:
                type: string
              binding:
                type: string
                enum: [normal, returned]
              inventoryLocationId:
                type: string

    LocationStock:
      type: object
      required: [location, locationName, quantity]
      properties:
        location:
          $ref: '#/components/schemas/StockLocation'
        locationName:
          type: string
          example: 門市現貨
        quantity:
          type: integer

    ProductStatus:
      type: string
      enum: [active, deleted]
      description: |
        Soft-delete record. `active` keeps the product on the shelf.
        `deleted` hides it from `GET /products` and from a new sale.
        The row is not removed. `GET /products/{productId}` still returns it.

    Product:
      type: object
      required:
        - id
        - sku
        - normalizedSku
        - barcode
        - brand
        - name
        - listPrice
        - inventories
        - totalInventory
        - loginStoreQuantity
        - loginStoreReturnedQuantity
        - status
      properties:
        id:
          type: string
        sku:
          type: string
          example: AA-79121
        normalizedSku:
          type: string
          example: AA79121
        barcode:
          type: string
          example: '471000000001'
        brand:
          type: string
        name:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
          description: Model scale (optional)
        spec:
          type: string
          description: Specification / edition / variant note
        material:
          type: string
        color:
          type: string
        imageUrl:
          type: string
        listPrice:
          type: integer
          description: 建議售價 / 門市定價 (即試算表之 MSRP)
        vipPrice:
          type: integer
        inventories:
          type: array
          description: One quantity per location. A missing row reads as 0. Quantity may be negative.
          items:
            $ref: '#/components/schemas/LocationStock'
        totalInventory:
          type: integer
          description: Sum of every location, including warehouses, returned locations, and negatives.
        loginStoreQuantity:
          type: integer
          nullable: true
          description: Quantity at the session store's normal location. `0` when that row is missing. `null` when the session has no selected store.
        loginStoreReturnedQuantity:
          type: integer
          nullable: true
          description: Quantity at the session store's returned location. `0` when that row is missing. `null` when the session has no selected store.
        loginStorePreorderQuantity:
          type: integer
          nullable: true
          description: Quantity at the session store's preorder location (預購保留). `0` when that row is missing. `null` when the session has no selected store.
        soldInLoginStore:
          type: boolean
          nullable: true
          description: >-
            Whether the login store sells this product.
            `null` when no store is selected. Always `true` for a `productScope: all` store. For a `list` store, `true` only when the product is in `store_product`. `GET /products/{productId}` returns unlisted products with `false`; the cart treats them like delisted items.
        note:
          type: string
        createdAt:
          type: string
          readOnly: true
          description: 建立時間
        createdBy:
          type: string
          readOnly: true
          description: 建檔人員 (後端由 Auth 取得)
        updatedAt:
          type: string
          readOnly: true
          description: 更新時間
        updatedBy:
          type: string
          readOnly: true
          description: 更新人員 (後端由 Auth 取得)
        status:
          $ref: '#/components/schemas/ProductStatus'

    CreateProductRequest:
      type: object
      required:
        - sku
        - barcode
        - brand
        - name
        - listPrice
      properties:
        sku:
          type: string
        barcode:
          type: string
          example: '471000000001'
        brand:
          type: string
        name:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
          description: Model scale (optional)
        spec:
          type: string
          description: Specification / edition / variant note
        material:
          type: string
        color:
          type: string
        imageUrl:
          type: string
        listPrice:
          type: integer
          minimum: 0
          description: 建議售價 / 門市定價 (即試算表之 MSRP)
        vipPrice:
          type: integer
          minimum: 0
        note:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'

    UpdateProductRequest:
      type: object
      description: Partial metadata update. Excludes stocks, totals, id, and normalizedSku.
      properties:
        sku:
          type: string
        barcode:
          type: string
          example: '471000000001'
        brand:
          type: string
        name:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
          description: Model scale (optional)
        spec:
          type: string
          description: Specification / edition / variant note
        material:
          type: string
        color:
          type: string
        imageUrl:
          type: string
        listPrice:
          type: integer
          minimum: 0
          description: 建議售價 / 門市定價 (即試算表之 MSRP)
        vipPrice:
          type: integer
          minimum: 0
        note:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'

    InventoryTransferRequest:
      type: object
      required: [productId, fromLocation, toLocation, quantity]
      properties:
        productId:
          type: string
        fromLocation:
          $ref: '#/components/schemas/StockLocation'
        toLocation:
          $ref: '#/components/schemas/StockLocation'
        quantity:
          type: integer
          minimum: 1
        reason:
          type: string

    MoveAllStockRequest:
      type: object
      required: [fromLocation, toLocation]
      properties:
        fromLocation:
          type: string
        toLocation:
          type: string
        reason:
          type: string

    CreateInventoryReceiptRequest:
      type: object
      required: [locationId, items]
      properties:
        locationId:
          type: string
        supplier:
          type: string
        note:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId:
                type: string
              quantity:
                type: integer
                minimum: 1

    InventoryReceipt:
      type: object
      required: [id, locationId, locationName, operatorName, createdAt, items, totalQuantity]
      properties:
        id:
          type: string
        locationId:
          type: string
        locationName:
          type: string
        supplier:
          type: string
        note:
          type: string
        operatorName:
          type: string
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            required: [productId, sku, name, quantity]
            properties:
              productId:
                type: string
              sku:
                type: string
              name:
                type: string
              quantity:
                type: integer
        totalQuantity:
          type: integer

    InventoryReceiptPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryReceipt'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    InventoryMovement:
      type: object
      required: [id, type, productId, locationId, quantityDelta, quantityAfter, sourceId, operatorName, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
        productId:
          type: string
        sku:
          type: string
        name:
          type: string
        locationId:
          type: string
        quantityDelta:
          type: integer
        quantityAfter:
          type: integer
        reason:
          type: string
        sourceId:
          type: string
        operatorName:
          type: string
        createdAt:
          type: string
          format: date-time

    InventoryMovementPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryMovement'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    StockAdjustRequest:
      type: object
      required: [productId, location, newQuantity, reason]
      properties:
        productId:
          type: string
        location:
          $ref: '#/components/schemas/StockLocation'
        newQuantity:
          type: integer
          description: Absolute quantity. May be negative.
        reason:
          type: string

    BatchStockAdjustRequest:
      type: object
      required: [adjustments]
      properties:
        note:
          type: string
          description: 選填（異動原因，含庫存調撥）。沒送或空白時伺服器存成 null。operatorName and timestamp are not sent.
        adjustments:
          type: array
          items:
            $ref: '#/components/schemas/StockItemAdjustment'

    StockLocationChange:
      type: object
      required: [location, locationName, oldQty, newQty, diff]
      properties:
        location:
          $ref: '#/components/schemas/StockLocation'
        locationName:
          type: string
        oldQty:
          type: integer
        newQty:
          type: integer
        diff:
          type: integer

    StockItemAdjustment:
      type: object
      required: [productId, sku, name, brand, changes, summaryText]
      properties:
        productId:
          type: string
        sku:
          type: string
        barcode:
          type: string
        name:
          type: string
        brand:
          type: string
        changes:
          type: array
          items:
            $ref: '#/components/schemas/StockLocationChange'
        summaryText:
          type: string

    StockAdjustmentLog:
      type: object
      required: [id, timestamp, operatorName, items, totalQtyChange]
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        operatorName:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/StockItemAdjustment'
        totalQtyChange:
          type: integer
        note:
          type: string

    PaymentMethodType:
      type: string
      enum: [cash, credit_card, line_pay, bank_transfer, cod]

    PaymentTender:
      type: object
      required: [type, name, amount]
      properties:
        type:
          $ref: '#/components/schemas/PaymentMethodType'
        name:
          type: string
          example: 現金
        amount:
          type: integer
        tenderedCash:
          type: integer
          description: Cash notes received
        changeAmount:
          type: integer
        transactionRef:
          type: string
          description: Card last-4 or transfer last-5

    CheckoutOrderItem:
      type: object
      required:
        - productId
        - sku
        - name
        - originalPrice
        - unitPrice
        - isManualPrice
        - quantity
        - subtotal
      properties:
        productId:
          type: string
        sku:
          type: string
        name:
          type: string
        scale:
          $ref: '#/components/schemas/ModelScale'
        originalPrice:
          type: integer
        unitPrice:
          type: integer
          description: 結帳成交單價
        isManualPrice:
          type: boolean
        priceDiffReason:
          type: string
        quantity:
          type: integer
          description: Positive for purchase, negative for return/exchange
        subtotal:
          type: integer
        pointsDiscountApplied:
          type: boolean
          default: false
          description: 這一列用會員點數折抵（1 件，單價最多扣 NT$360、最低 0）。unitPrice 已是扣過後的單價。只存旗標；退貨列沿用原列旗標。
        preorderPickup:
          type: boolean
          default: false
          description: 預購取貨：這一列從門市的預購保留地點扣庫存。只會出現在銷售列。
        note:
          type: string
          description: 項目備註
        returnedQuantity:
          type: integer
          description: Cumulative quantity returned against this line item
          default: 0
        originalOrderId:
          type: string
        originalOrderItemId:
          type: string
        restock:
          type: boolean
          default: true
        returnReason:
          type: string
        inventoryLocationId:
          type: string
          description: Location this line changed. Normal location when restock is not false; returned location when restock is false.
        inventoryLocationName:
          type: string

    OrderStatus:
      type: string
      enum: [completed, partially_refunded, refunded]

    CheckoutOrder:
      type: object
      required:
        - id
        - orderNumber
        - cashierId
        - cashierName
        - status
        - items
        - itemsSubtotal
        - discountAmount
        - shippingFee
        - totalAmount
        - payments
        - createdAt
      properties:
        id:
          type: string
        orderNumber:
          type: string
          example: SO-20260830-0088
        cashierId:
          type: string
        cashierName:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        customerId:
          type: string
        customerName:
          type: string
        customerPhone:
          type: string
        branchId:
          type: string
          description: Checkout store (the login store at checkout; for a return, the store that processed it). Old orders may be `branch-store` / `branch-online` or a deleted store.
        branchName:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutOrderItem'
        itemsSubtotal:
          type: integer
        discountAmount:
          type: integer
          description: 折讓 = 手動改價且沒有點數旗標的列 Σ(originalPrice − unitPrice) × quantity。
        pointsDiscountAmount:
          type: integer
          description: 點數折抵 = 有點數旗標的列 Σ(originalPrice − unitPrice) × quantity（整個差額，即使也手動改價）。由明細計算。
        shippingFee:
          type: integer
        totalAmount:
          type: integer
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PaymentTender'
        note:
          type: string
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: 建立時間
        createdBy:
          type: string
          readOnly: true
          description: 建檔人員
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: 更新時間
        updatedBy:
          type: string
          readOnly: true
          description: 更新人員

    CreateOrderItemPayload:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          description: Positive for purchase, negative for return/exchange
        unitPrice:
          type: integer
          description: Cashier-set unit price (re-validated by server unless isManualPrice is true)
        isManualPrice:
          type: boolean
          default: false
        priceDiffReason:
          type: string
        pointsDiscountApplied:
          type: boolean
          default: false
          description: 這個商品用會員點數折抵 NT$360。需要 customerId 與 unitPrice（已扣過、不可為負）；同一 productId 一張單只能一次；退貨列不可用。
        preorderPickup:
          type: boolean
          default: false
          description: 預購取貨：從登入門市的預購保留地點扣庫存，不扣門市庫存。只能用在銷售列（退貨列送 true 回 422），可以和點數折抵同時使用。
        originalOrderId:
          type: string
          description: Required when quantity < 0 (links return to original sales order)
        originalOrderItemId:
          type: string
          description: Required when quantity < 0 (links return to original item line)
        restock:
          type: boolean
          default: true
          description: For a return, true or omitted adds quantity to the login store's normal location. false adds it to the returned location. Both change quantity.
        returnReason:
          type: string
        note:
          type: string

    CreateOrderPayload:
      type: object
      required: [items, payments]
      properties:
        customerId:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderItemPayload'
        shippingFee:
          type: integer
          default: 0
        payments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PaymentTender'
        note:
          type: string

    CheckoutReceipt:
      type: object
      required: [order]
      properties:
        order:
          $ref: '#/components/schemas/CheckoutOrder'

    VipTier:
      type: string
      enum: [Retail, B, A, S]

    Customer:
      type: object
      required:
        - id
        - name
        - phone
        - vipTier
        - vipTierName
        - totalSpent
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
          description: Customer_Name (客戶姓名/名稱)
        phone:
          type: string
          description: Phone (電話/手機)
        email:
          type: string
          format: email
        vipTier:
          $ref: '#/components/schemas/VipTier'
          description: Tier (等級：Retail, B, A, S)
        vipTierName:
          type: string
        totalSpent:
          type: integer
        note:
          type: string
          description: 備註
        createdAt:
          type: string
          readOnly: true
          description: 建立時間
        createdBy:
          type: string
          readOnly: true
          description: 建檔人員 (後端由 Auth 取得)
        updatedAt:
          type: string
          readOnly: true
          description: 更新時間
        updatedBy:
          type: string
          readOnly: true
          description: 更新人員 (後端由 Auth 取得)

    CreateCustomerRequest:
      type: object
      required:
        - name
        - phone
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        vipTier:
          $ref: '#/components/schemas/VipTier'
        note:
          type: string

    UpdateCustomerRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        vipTier:
          $ref: '#/components/schemas/VipTier'
        note:
          type: string

    CustomerSearchResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          example: 42

    StoreDto:
      type: object
      required: [name, inventoryLocationId, inventoryLocationName, returnedInventoryLocationId, returnedInventoryLocationName, preorderInventoryLocationId, preorderInventoryLocationName]
      properties:
        name:
          type: string
          example: 奇可門市
        isDefault:
          type: boolean
          default: false
        inventoryLocationId:
          type: string
        inventoryLocationName:
          type: string
        returnedInventoryLocationId:
          type: string
        returnedInventoryLocationName:
          type: string
        preorderInventoryLocationId:
          type: string
          description: 預購保留。預購取貨的列從這裡扣。
        preorderInventoryLocationName:
          type: string
        productScope:
          $ref: '#/components/schemas/StoreProductScope'

    CreateStoreRequest:
      type: object
      required: [name, inventoryLocationId, returnedInventoryLocationId]
      properties:
        name:
          type: string
          example: 線上網購
        inventoryLocationId:
          type: string
          description: Existing location for normal goods. May match returnedInventoryLocationId.
        returnedInventoryLocationId:
          type: string
        preorderInventoryLocationId:
          type: string
          description: Existing location for preorder stock. Omitted → system location 預購保留.
        productScope:
          $ref: '#/components/schemas/StoreProductScope'

    UpdateStoreBindingRequest:
      type: object
      required: [inventoryLocationId, returnedInventoryLocationId]
      properties:
        inventoryLocationId:
          type: string
        returnedInventoryLocationId:
          type: string
        preorderInventoryLocationId:
          type: string
          description: Omitted → keep the current preorder binding.

    StoreProductScope:
      type: string
      enum: [all, list]
      default: all
      description: |
        `all`: the store sells every product (default; existing stores).
        `list`: the store sells only products in its `store_product` list. Product search, the inventory page,
        and checkout use the list. Per-location columns and `totalInventory` still cover every location.

    UpdateStoreProductScopeRequest:
      type: object
      required: [productScope]
      properties:
        productScope:
          $ref: '#/components/schemas/StoreProductScope'

    StoreProductItem:
      type: object
      description: One catalog product on the store list editor, with whether it is in the list.
      required: [productId, sku, barcode, brand, name, listPrice, inList]
      properties:
        productId:
          type: string
        sku:
          type: string
        barcode:
          type: string
        brand:
          type: string
        name:
          type: string
        scale:
          type: string
          nullable: true
        listPrice:
          type: integer
        imageUrl:
          type: string
          nullable: true
        inList:
          type: boolean
        addedAt:
          type: string
          format: date-time
          nullable: true
          description: Server time when added. `null` when not in the list.
        addedBy:
          type: string
          nullable: true
          description: Display name of the signed-in account that added it. `null` when not in the list.

    StoreProductPage:
      type: object
      required: [storeName, productScope, listedTotal, items, page, pageSize, total]
      properties:
        storeName:
          type: string
        productScope:
          $ref: '#/components/schemas/StoreProductScope'
        listedTotal:
          type: integer
          description: Products in the list, excluding deleted products. Not affected by keyword / inList.
        items:
          type: array
          items:
            $ref: '#/components/schemas/StoreProductItem'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          description: Rows matching keyword / inList.

    StoreProductBatchRequest:
      type: object
      description: At least one id overall, at most 2000 in total, and no id in both lists.
      properties:
        add:
          type: array
          items:
            type: string
          default: []
        remove:
          type: array
          items:
            type: string
          default: []

    CopyStoreProductsRequest:
      type: object
      required: [sourceStoreName]
      properties:
        sourceStoreName:
          type: string
        replace:
          type: boolean
          default: false
          description: |
            `false`: add the source's products to this list (existing rows kept).
            `true`: also remove products the source does not have. Rows in both keep their addedAt / addedBy.

    StoreProductChangeResult:
      type: object
      required: [storeName, productScope, changed, added, removed, listedTotal]
      properties:
        storeName:
          type: string
        productScope:
          $ref: '#/components/schemas/StoreProductScope'
        changed:
          type: integer
          description: Rows actually added plus rows actually removed.
        added:
          type: integer
        removed:
          type: integer
        listedTotal:
          type: integer

    OAuthRole:
      type: string
      enum: [admin, staff]
      description: Access control role for Google OAuth accounts
      example: admin

    OAuthAccountDto:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          example: fred@gmail.com
        role:
          $ref: '#/components/schemas/OAuthRole'
        name:
          type: string
          example: 店長 Fred
          description: Display name / cashier name
        note:
          type: string
          example: 系統最高管理員 / 總部
          description: Optional note / job title / shift info

    CreateOAuthAccountRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          example: clerk01@gmail.com
        role:
          $ref: '#/components/schemas/OAuthRole'
        name:
          type: string
          example: 王小美
        note:
          type: string
          example: 台北店早班店員

    UpdateOAuthAccountRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/OAuthRole'
        name:
          type: string
          example: 王小美
        note:
          type: string
          example: 台北店早班主管

